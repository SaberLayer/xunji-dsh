<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>寻迹助手</title>
<style>
  :root { color-scheme: light dark }
  html, body { height: 100%; margin: 0 }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #fbfcfe; color: #182230;
  }
  @media (prefers-color-scheme: dark) { body { background: #14171c; color: #e6e9ef } }
  .box { width: 360px; text-align: center }
  .mark {
    width: 52px; height: 52px; margin: 0 auto 20px; border-radius: 15px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #315de0, #3b6ff5);
    box-shadow: 0 8px 22px rgba(49, 93, 224, .25);
  }
  .mark svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 1.6 }
  h1 { margin: 0 0 8px; font-size: 17px; font-weight: 650 }
  p { margin: 0; font-size: 13px; line-height: 20px; opacity: .62; min-height: 40px }
  .bar { margin-top: 22px; height: 3px; border-radius: 3px; background: rgba(128,140,160,.18); overflow: hidden }
  .bar i { display: block; height: 100%; width: 38%; border-radius: 3px; background: #3b6ff5; animation: slide 1.25s ease-in-out infinite }
  @keyframes slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(360%) } }
  .failed .bar { display: none }
  .failed p { opacity: .8; white-space: pre-wrap; text-align: left; font-size: 12px; line-height: 18px }
</style>
</head>
<body>
  <div class="box" id="box">
    <div class="mark">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="4.5" width="17" height="15" rx="3"/>
        <path d="M9.5 4.5v15M13 9.5h4M13 13h4"/>
      </svg>
    </div>
    <h1>寻迹助手</h1>
    <p id="status">正在启动…</p>
    <div class="bar"><i></i></div>
  </div>
<script>
  const status = document.getElementById('status')
  const box = document.getElementById('box')
  // 外壳通过该事件推送启动进度；失败时停留在本页并显示原因
  window.__WORKBENCH__ = {
    progress(text) { status.textContent = text },
    failed(text) { box.classList.add('failed'); status.textContent = text },
  }
</script>
</body>
</html>
